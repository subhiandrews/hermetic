# Generated by `hermetic compose` from dependencies.json. Do not edit: run it again.
# Engines keep their data in memory, and everything is published on 127.0.0.1 only.
name: hermetic-orders
services:
  mongo:
    image: mongo:7
    tmpfs:
    - /data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping').ok
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
    - 127.0.0.1::27017
    security_opt:
    - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512
    restart: 'no'
  carts:
    image: wiremock/wiremock:3.9.1
    command:
    - --disable-banner
    volumes:
    - ./mocks/carts:/home/wiremock/mappings:ro
    ports:
    - 127.0.0.1::8080
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    restart: 'no'
  payment:
    image: wiremock/wiremock:3.9.1
    command:
    - --disable-banner
    volumes:
    - ./mocks/payment:/home/wiremock/mappings:ro
    ports:
    - 127.0.0.1::8080
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    restart: 'no'
  user:
    image: wiremock/wiremock:3.9.1
    command:
    - --disable-banner
    volumes:
    - ./mocks/user:/home/wiremock/mappings:ro
    ports:
    - 127.0.0.1::8080
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    restart: 'no'
