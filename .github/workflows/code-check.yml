name: code-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push cancels the review of the previous commit.
concurrency:
  group: code-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Full review: every reviewer on the panel, security and performance included, no routing.
      CODE_CHECK_REVIEW__FULL: "true"
      CODE_CHECK_REVIEW__SECURITY: "true"
      CODE_CHECK_REVIEW__PERFORMANCE: "true"
    steps:
      - uses: subhiandrews/code-check-action@c7ea220d8033092d50d1ff10306d84dd24d64aac # v1 (v0.1.3)
        with:
          code-check-ref: v1.4.2
          # Token from `claude setup-token`, stored as a repository secret.
          # To bill API credits instead, pass `anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}`.
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          security: "true"
          # A failed review shows as a red check, not a silent green one.
          fail-on-error: true
          # No github-token: the default GITHUB_TOKEN posts as github-actions[bot].
