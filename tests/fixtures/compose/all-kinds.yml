# Generated by `hermetic compose` from dependencies.json. Do not edit: run it again.
# Engines keep their data in memory, and everything is published on 127.0.0.1 only.
name: hermetic-shop
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hermetic
      POSTGRES_PASSWORD: hermetic
      POSTGRES_DB: hermetic
    tmpfs:
    - /var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U hermetic -d hermetic
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
    - 127.0.0.1::5432
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    restart: 'no'
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: hermetic
      MYSQL_DATABASE: hermetic
    tmpfs:
    - /var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -uroot
      - -phermetic
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
    - 127.0.0.1::3306
    security_opt:
    - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512
    restart: 'no'
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
    - 127.0.0.1::6379
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    restart: 'no'
  mongo:
    image: mongo:7
    tmpfs:
    - /data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping').ok
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
    - 127.0.0.1::27017
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    restart: 'no'
  payments:
    image: wiremock/wiremock:3.9.1
    command:
    - --disable-banner
    volumes:
    - ./mocks/payments:/home/wiremock/mappings:ro
    ports:
    - 127.0.0.1::8080
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    restart: 'no'
