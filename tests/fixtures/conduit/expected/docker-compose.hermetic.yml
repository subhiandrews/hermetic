# Generated by `hermetic compose` from dependencies.json. Do not edit: run it again.
# Engines keep their data in memory, and everything is published on 127.0.0.1 only.
name: hermetic-conduit
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hermetic
      POSTGRES_PASSWORD: hermetic
      POSTGRES_DB: hermetic
    tmpfs:
    - /var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U hermetic -d hermetic
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
    - 127.0.0.1::5432
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    restart: 'no'
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
    - 127.0.0.1::6379
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    restart: 'no'
  mail:
    image: wiremock/wiremock:3.9.1
    command:
    - --disable-banner
    volumes:
    - ./mocks/mail:/home/wiremock/mappings:ro
    ports:
    - 127.0.0.1::8080
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    restart: 'no'
